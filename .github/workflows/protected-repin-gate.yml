# protected-repin-gate: owner-controlled gate for Project FAR.
# Workflow registration refresh.
# This repository must remain inaccessible to agent integrations.

name: protected-repin-gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: evaluate open pull requests, or audit main's protection
        type: choice
        options: [evaluate, audit]
        default: evaluate

permissions: {}

concurrency:
  group: protected-repin-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: far-repin-gate

    env:
      FAR_REPOSITORY: notfoundout/Project-FAR
      FAR_REPOSITORY_ID: "1283452680"
      FAR_DEPLOYED_COMMIT: 2ef446b07cc0dcbce684100036b255e275914be7
      FAR_APP_ID: "5073230"
      FAR_GATE_REPOSITORY_ID: "1387422283"

    steps:
      - name: Check out the pinned evaluator
        run: |
          set -euo pipefail
          git init -q deploy
          git -C deploy fetch -q --depth=1 --no-tags --no-recurse-submodules \
            "https://github.com/$FAR_REPOSITORY.git" \
            "$FAR_DEPLOYED_COMMIT"
          git -C deploy -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C deploy rev-parse HEAD)" = "$FAR_DEPLOYED_COMMIT"

      - name: Run one gate cycle
        env:
          FAR_APP_PRIVATE_KEY: ${{ secrets.FAR_APP_PRIVATE_KEY }}
          FAR_MODE: ${{ inputs.mode || 'evaluate' }}
        run: python3 deploy/far_validation/repin_gate_app.py actions --mode "$FAR_MODE"
